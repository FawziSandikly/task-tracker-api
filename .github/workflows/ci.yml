name: CI

on:
  push:
    branches: [ main, final-project ]
  pull_request:
    branches: [ main, final-project ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8 (optional warnings)
      run: |
        pip install flake8
        flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics || true
    
    - name: Run pytest
      run: |
        pytest --verbose --tb=short
    
    - name: Run pytest with coverage
      run: |
        pip install pytest-cov
        pytest --cov=app --cov-report=term-missing tests/

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: task-tracker:latest
    
    - name: Build and run Docker container for health check
      run: |
        docker build -t task-tracker:latest .
        docker run -d -p 8000:8000 --name task-tracker task-tracker:latest
        sleep 3
        curl -f http://localhost:8000/api/v1/health || exit 1
        docker stop task-tracker
